[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-agent-runtime"
# Una sola fuente de verdad: `athena.__version__`, que es la que ensena la ventana.
dynamic = ["version"]
description = "Provider-neutral contracts for the Athena autonomous-agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Athena contributors" }]
dependencies = []

[project.scripts]
athena = "athena.cli:main"
athena-service = "athena_service:main"

[project.gui-scripts]
athena-desktop = "athena_desktop.app:main"

[project.optional-dependencies]
# Fijadas: son las versiones con las que se comprueban las cuatro puertas (A24). Un
# rango deja que la misma instalacion de resultados distintos segun el dia.
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.16.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "athena.__version__" }

[tool.setuptools.package-data]
athena = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
